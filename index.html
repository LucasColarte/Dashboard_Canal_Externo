{num:"15",label:"Pisos + 2 subterráneos"},{num:"300",label:"Departamentos en 2 tipologías"},{num:"156",label:"Estacionamientos"},{num:"120",label:"Bodegas"},{num:"3",label:"Locales comerciales (1er piso)"},{num:"15.612 m²",label:"Útiles"},{num:"165 m²",label:"Comerciales"}],actores:[{rol:"Constructora",nombre:"Constructora Marga Marga S.A."},{rol:"Inmobiliaria",nombre:"BRIO S.A."}],ubicacionTitulo:"Av. Santa Rosa Nº 3672-3682",ubicacion:"El proyecto estará situado en el límite comunal entre San Joaquín (oriente) y San Miguel (poniente), a la altura del paradero 10 de la Avenida Santa Rosa. Es una zona de fuerte carácter mixto, históricamente industrial y comercial ligera, que hoy vive una activa renovación urbana e interés inmobiliario habitacional por su excelente conectividad.",constructora:"Inmobiliaria Brio tiene fuerte vocación en soluciones habitacionales para familias chilenas, especializada en proyectos de integración social. Tiene presencia nacional, principalmente en las regiones de Valparaíso, O'Higgins y Maule, y desarrolla actualmente 9 proyectos activos, con oficinas centrales en la Región Metropolitana.",ds19:{intro:"El DS19 es un programa del SERVIU orientado a promover la integración social, con familias vulnerables y de clase media en un mismo proyecto. Los proyectos concursan anualmente por subsidio y, según el puntaje obtenido, se asignan recursos y distintos niveles de bonificación a los compradores de todos los segmentos.",sectores:[{n:"Sector vulnerable",pct:"25% de las unidades",tope:"Vivienda hasta 1.600 UF"},{n:"Sector emergente",pct:"15% de las unidades",tope:"Vivienda hasta 1.900 UF · crédito hipotecario"},{n:"Sector medio",pct:"60% de las unidades",tope:"Vivienda hasta 3.200 UF · crédito hipotecario"}],ventajas:[{t:"Velocidad de venta y absorción",a:"Proyecto DS-19: significativamente más rápida, al tener colocación asegurada y demanda por déficit habitacional.",b:"Tradicional: mayor riesgo por venta; depende del ciclo económico, salario
